# A2A Synchronization Configuration
# This file configures the A2A (Agent-to-Agent) synchronization features
# for the openHAB AI system.

# Task Ordering Configuration
# Controls how tasks are ordered and executed
task_ordering.enabled=true
task_ordering.max_parallel_tasks=5
task_ordering.timeout_seconds=30

# Deadlock Prevention Configuration
# Prevents and resolves deadlocks in task dependencies
deadlock_prevention.enabled=true
deadlock_prevention.max_wait_time=60
deadlock_prevention.auto_resolve=true

# Fault Tolerance Configuration
# Handles failures and provides recovery mechanisms
fault_tolerance.max_retries=3
fault_tolerance.retry_delay_ms=1000
fault_tolerance.fallback_enabled=true

# Resource Locking Configuration
# Manages concurrent access to shared resources
resource_locking.enabled=true
resource_locking.max_wait_time=30
resource_locking.auto_release=true

# Monitoring Configuration
# Monitors system health and performance
monitoring.enabled=true
monitoring.check_interval_ms=10000
monitoring.stuck_task_threshold_ms=300000

# Agent Registry Configuration
# Manages agent registration and discovery
agent_registry.enabled=true
agent_registry.auto_discovery=true
agent_registry.heartbeat_interval_ms=30000
agent_registry.timeout_ms=60000

# Task Schema Configuration
# Controls schema generation and validation
schema_generation.enabled=true
schema_generation.cache_ttl_ms=300000
schema_generation.auto_validate=true
schema_generation.max_versions=10

# Security Configuration
# Controls access and authentication
security.enabled=true
security.require_authentication=true
security.max_concurrent_sessions=100
security.session_timeout_ms=3600000

# Performance Configuration
# Optimizes system performance
performance.max_thread_pool_size=20
performance.queue_capacity=1000
performance.metrics_enabled=true
performance.slow_query_threshold_ms=5000 