# =============================================================================
# OpenHAB AI - Model Configuration
# =============================================================================
# This file configures the AI model providers for the AI system.
# 
# Configuration follows the pattern: ai.model.provider.setting=value
# 
# File location: conf/ai/ai.model.cfg
# Auto-reload: Yes (changes are detected automatically)
# =============================================================================

# =============================================================================
# GLOBAL MODEL SETTINGS
# =============================================================================

# Primary model provider (used for most requests)
# Options: openai, anthropic, google, azure, ollama, localai, vllm, lmstudio
ai.model.primary.provider=ollama

# Fallback model provider (used when primary fails)
# Options: openai, anthropic, google, azure, ollama, localai, vllm, lmstudio
ai.model.fallback.provider=openai

# Enable hybrid mode (use multiple providers for different tasks)
ai.model.hybrid.enabled=true

# Enable load balancing between providers
ai.model.load.balancing.enabled=false

# Default parameters for model requests
ai.model.default.temperature=0.3
ai.model.default.maxTokens=1000
ai.model.default.timeoutMs=30000
ai.model.default.retryAttempts=3

# =============================================================================
# OPENAI CONFIGURATION
# =============================================================================

# OpenAI API Key (required for OpenAI provider)
# Get from: https://platform.openai.com/api-keys
ai.model.openai.apiKey=your_openai_api_key_here

# OpenAI Organization ID (optional)
# ai.model.openai.organizationId=org-your_org_id_here

# OpenAI Base URL (optional, defaults to https://api.openai.com/v1)
# ai.model.openai.baseUrl=https://api.openai.com/v1

# Default OpenAI model
ai.model.openai.defaultModel=gpt-4o-mini

# OpenAI timeout in milliseconds
ai.model.openai.timeoutMs=30000

# OpenAI retry attempts
ai.model.openai.retryAttempts=3

# Enable OpenAI provider
ai.model.openai.enabled=true

# =============================================================================
# ANTHROPIC CONFIGURATION
# =============================================================================

# Anthropic API Key (required for Anthropic provider)
# Get from: https://console.anthropic.com/
ai.model.anthropic.apiKey=your_anthropic_api_key_here

# Anthropic Base URL (optional, defaults to https://api.anthropic.com)
# ai.model.anthropic.baseUrl=https://api.anthropic.com

# Default Anthropic model
ai.model.anthropic.defaultModel=claude-3-5-sonnet-20241022

# Anthropic timeout in milliseconds
ai.model.anthropic.timeoutMs=30000

# Anthropic retry attempts
ai.model.anthropic.retryAttempts=3

# Enable Anthropic provider
ai.model.anthropic.enabled=false

# =============================================================================
# GOOGLE GENAI CONFIGURATION
# =============================================================================

# Google API Key (required for Google GenAI provider)
# Get from: https://makersuite.google.com/app/apikey
ai.model.google.apiKey=your_google_api_key_here

# Google Base URL (optional, defaults to https://generativelanguage.googleapis.com)
# ai.model.google.baseUrl=https://generativelanguage.googleapis.com

# Default Google model
ai.model.google.defaultModel=gemini-1.5-pro

# Google timeout in milliseconds
ai.model.google.timeoutMs=30000

# Google retry attempts
ai.model.google.retryAttempts=3

# Enable Google provider
ai.model.google.enabled=false

# =============================================================================
# AZURE OPENAI CONFIGURATION
# =============================================================================

# Azure OpenAI API Key (required for Azure provider)
# Get from: Azure Portal > OpenAI Service > Keys and Endpoint
ai.model.azure.apiKey=your_azure_api_key_here

# Azure OpenAI Endpoint (required for Azure provider)
# Format: https://your-resource-name.openai.azure.com/
ai.model.azure.endpoint=https://your-resource-name.openai.azure.com/

# Azure OpenAI Deployment Name (required for Azure provider)
ai.model.azure.deploymentName=your-deployment-name

# Azure OpenAI API Version (optional, defaults to 2024-02-15-preview)
ai.model.azure.apiVersion=2024-02-15-preview

# Azure timeout in milliseconds
ai.model.azure.timeoutMs=30000

# Azure retry attempts
ai.model.azure.retryAttempts=3

# Enable Azure provider
ai.model.azure.enabled=false

# =============================================================================
# OLLAMA CONFIGURATION (LOCAL)
# =============================================================================

# Ollama Base URL (optional, defaults to http://localhost:11434)
ai.model.ollama.baseUrl=http://localhost:11434

# Default Ollama model
ai.model.ollama.defaultModel=llama3.1:8b

# Ollama timeout in milliseconds
ai.model.ollama.timeoutMs=60000

# Ollama retry attempts
ai.model.ollama.retryAttempts=2

# Enable Ollama provider
ai.model.ollama.enabled=true

# =============================================================================
# LOCALAI CONFIGURATION (LOCAL)
# =============================================================================

# LocalAI Base URL (optional, defaults to http://localhost:8080)
ai.model.localai.baseUrl=http://localhost:8080

# Default LocalAI model
ai.model.localai.defaultModel=gpt-3.5-turbo

# LocalAI timeout in milliseconds
ai.model.localai.timeoutMs=60000

# LocalAI retry attempts
ai.model.localai.retryAttempts=2

# Enable LocalAI provider
ai.model.localai.enabled=false

# =============================================================================
# VLLM CONFIGURATION (LOCAL)
# =============================================================================

# vLLM Base URL (optional, defaults to http://localhost:8000)
ai.model.vllm.baseUrl=http://localhost:8000

# Default vLLM model
ai.model.vllm.defaultModel=meta-llama/Llama-2-7b-chat-hf

# vLLM timeout in milliseconds
ai.model.vllm.timeoutMs=60000

# vLLM retry attempts
ai.model.vllm.retryAttempts=2

# Enable vLLM provider
ai.model.vllm.enabled=false

# =============================================================================
# LM STUDIO CONFIGURATION (LOCAL)
# =============================================================================

# LM Studio Base URL (optional, defaults to http://localhost:1234)
ai.model.lmstudio.baseUrl=http://localhost:1234

# Default LM Studio model
ai.model.lmstudio.defaultModel=local-model

# LM Studio timeout in milliseconds
ai.model.lmstudio.timeoutMs=60000

# LM Studio retry attempts
ai.model.lmstudio.retryAttempts=2

# Enable LM Studio provider
ai.model.lmstudio.enabled=false

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Enable debug logging for model operations
ai.model.debug.enabled=false

# Enable cost tracking (for cloud providers)
ai.model.cost.tracking.enabled=true

# Enable performance monitoring
ai.model.performance.monitoring.enabled=true

# Maximum concurrent requests per provider
ai.model.max.concurrent.requests=10

# Request queue size
ai.model.request.queue.size=100

# Health check interval in seconds
ai.model.health.check.interval=30

# Circuit breaker failure threshold
ai.model.circuit.breaker.failure.threshold=5

# Circuit breaker recovery timeout in seconds
ai.model.circuit.breaker.recovery.timeout=60 