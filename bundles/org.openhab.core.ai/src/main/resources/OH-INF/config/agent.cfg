# openHAB Agent Bundle Configuration
# This file configures the Agent management and coordination features

# =============================================================================
# Agent Server Configuration
# =============================================================================

# Server Identity
ai.agent.server.id=openhab-agent-server
ai.agent.server.name=openHAB Agent Server
ai.agent.server.version=1.0.0
ai.agent.server.description=openHAB Agent Server for Multi-Agent Coordination

# Server Features
ai.agent.server.enable.skills=true
ai.agent.server.enable.tasks=true
ai.agent.server.enable.push.notifications=true
ai.agent.server.enable.persistence=true

# =============================================================================
# Persistence Configuration
# =============================================================================

# Persistence Enablement
ai.agent.persistence.enabled=true
ai.agent.persistence.service=mapdb
ai.agent.persistence.backup.enabled=true
ai.agent.persistence.backup.interval=24h
ai.agent.persistence.backup.retention=7d

# Data Retention Settings
ai.agent.persistence.retention.tasks=30d
ai.agent.persistence.retention.executions=90d
ai.agent.persistence.retention.statistics=1y
ai.agent.persistence.retention.logs=30d
ai.agent.persistence.retention.metadata=1y

# Storage Configuration
ai.agent.storage.tasks.key=a2a-tasks
ai.agent.storage.metadata.key=a2a-metadata
ai.agent.storage.statistics.key=a2a-statistics
ai.agent.storage.config.key=a2a-config
ai.agent.storage.recovery.key=a2a-recovery
ai.agent.storage.push.notifications.key=a2a-push-notifications

# =============================================================================
# Task Execution Configuration
# =============================================================================

# Execution Limits
ai.agent.execution.max.concurrent.tasks=10
ai.agent.execution.max.queue.size=100
ai.agent.execution.timeout=300s
ai.agent.execution.cleanup.interval=60s

# Retry Policy
ai.agent.execution.retry.max.attempts=3
ai.agent.execution.retry.backoff.multiplier=2.0
ai.agent.execution.retry.initial.delay=1s
ai.agent.execution.retry.max.delay=60s

# Task Lifecycle
ai.agent.execution.task.states=CREATED,VALIDATED,QUEUED,EXECUTING,COMPLETED,FAILED,CANCELLED,TIMEOUT
ai.agent.execution.task.timeout=300s
ai.agent.execution.task.cancellation.enabled=true

# =============================================================================
# Push Notifications Configuration
# =============================================================================

# Push Notification Enablement
ai.agent.push.notifications.enabled=true
ai.agent.push.notifications.persistence.enabled=true
ai.agent.push.notifications.validation.enabled=true

# Push Notification Settings
ai.agent.push.notifications.max.retries=3
ai.agent.push.notifications.retry.delay=5s
ai.agent.push.notifications.timeout=30s
ai.agent.push.notifications.batch.size=10

# Push Notification Types
ai.agent.push.notifications.types=task.completed,task.failed,task.timeout,system.alert,ai.agent.message
ai.agent.push.notifications.priority.levels=low,normal,high,critical

# =============================================================================
# Agent Management Configuration
# =============================================================================

# Agent Coordination
ai.agent.agents.max.count=50
ai.agent.agents.coordination.enabled=true
ai.agent.agents.communication.enabled=true
ai.agent.agents.negotiation.enabled=true

# Agent Security
ai.agent.agents.security.enabled=true
ai.agent.agents.authentication.required=true
ai.agent.agents.authorization.enabled=true
ai.agent.agents.audit.logging.enabled=true

# Agent Lifecycle
ai.agent.agents.registration.enabled=true
ai.agent.agents.heartbeat.interval=30s
ai.agent.agents.timeout=120s
ai.agent.agents.cleanup.interval=300s

# =============================================================================
# Skills Configuration
# =============================================================================

# Skills Enablement
ai.agent.skills.enabled=true
ai.agent.skills.auto.discovery=true
ai.agent.skills.validation.enabled=true
ai.agent.skills.caching.enabled=true

# Skills Categories
ai.agent.skills.categories=items,things,channels,rules,config,system,security,filesystem,scripts,persistence,events,bindings,discovery,monitoring,analytics,automation

# Skills Performance
ai.agent.skills.max.concurrent.executions=5
ai.agent.skills.execution.timeout=60s
ai.agent.skills.cache.size=1000
ai.agent.skills.cache.ttl=3600s

# =============================================================================
# Security Configuration
# =============================================================================

# Authentication
ai.agent.security.auth.enabled=true
ai.agent.security.auth.methods=oauth2.1,openhab_users,api_key,jwt
ai.agent.security.auth.primary.method=oauth2.1
ai.agent.security.auth.fallback.method=openhab_users

# Protocol-Specific Authentication Settings
ai.agent.security.auth.protocol.name=a2a
ai.agent.security.auth.protocol.permissions=a2a:read,a2a:send,a2a:receive,a2a:task,a2a:admin
ai.agent.security.auth.protocol.session.timeout=3600
ai.agent.security.auth.protocol.session.refresh.enabled=true
ai.agent.security.auth.protocol.session.refresh.threshold=300

# Permission Mapping Configuration
ai.agent.security.auth.permissions.read.operations=get_agent_card,get_health,get_status,get_task_status
ai.agent.security.auth.permissions.send.operations=send_message,create_task,notify_agent
ai.agent.security.auth.permissions.receive.operations=receive_message,receive_task,receive_notification
ai.agent.security.auth.permissions.task.operations=get_task,cancel_task,update_task,execute_task
ai.agent.security.auth.permissions.admin.operations=manage_agents,configure_server,manage_users,view_analytics

# Session Management Configuration
ai.agent.security.auth.session.timeout.seconds=3600
ai.agent.security.auth.session.max.concurrent=10
ai.agent.security.auth.session.cleanup.interval=300
ai.agent.security.auth.session.invalidation.enabled=true

# Authorization
ai.agent.security.authorization.enabled=true
ai.agent.security.role.based.access=true
ai.agent.security.permission.levels=read,write,admin

# Rate Limiting
ai.agent.security.rate.limit.enabled=true
ai.agent.security.rate.limit.requests.per.minute=1000
ai.agent.security.rate.limit.max.connections=100

# =============================================================================
# Security Policy Configuration
# =============================================================================

# Rate Limiting Configuration per Authentication Scheme
ai.agent.security.rate.limit.oauth.requests.per.minute=1000
ai.agent.security.rate.limit.openhab.users.requests.per.minute=500
ai.agent.security.rate.limit.api.key.requests.per.minute=2000
ai.agent.security.rate.limit.jwt.requests.per.minute=1000

# Access Control Configuration per Protocol
ai.agent.security.access.control.ai.agent.read.enabled=true
ai.agent.security.access.control.ai.agent.send.enabled=true
ai.agent.security.access.control.ai.agent.receive.enabled=true
ai.agent.security.access.control.ai.agent.task.enabled=true
ai.agent.security.access.control.ai.agent.admin.enabled=false

# Audit Logging Configuration
ai.agent.security.audit.logging.enabled=true
ai.agent.security.audit.logging.level=INFO
ai.agent.security.audit.logging.events=authentication,authorization,session,permission_check,message_send,message_receive,task_execution
ai.agent.security.audit.logging.retention.days=90

# Security Monitoring Configuration
ai.agent.security.monitoring.enabled=true
ai.agent.security.monitoring.incident.detection.enabled=true
ai.agent.security.monitoring.alert.threshold=10
ai.agent.security.monitoring.alert.window=300

# Incident Response Configuration
ai.agent.security.incident.response.enabled=true
ai.agent.security.incident.response.auto.block.enabled=false
ai.agent.security.incident.response.block.duration=3600
ai.agent.security.incident.response.notification.enabled=true

# Cross-Protocol Authentication Configuration
ai.agent.security.cross.protocol.auth.enabled=true
ai.agent.security.cross.protocol.auth.sharing.enabled=true
ai.agent.security.cross.protocol.auth.migration.enabled=true
ai.agent.security.cross.protocol.auth.policies.enabled=true

# =============================================================================
# Logging Configuration
# =============================================================================

# Logging Levels
ai.agent.logging.level=INFO
ai.agent.logging.structured=true
ai.agent.logging.include.metadata=true
ai.agent.logging.performance.tracking=true

# Logging Categories
ai.agent.logging.category.server=INFO
ai.agent.logging.category.tasks=DEBUG
ai.agent.logging.category.skills=INFO
ai.agent.logging.category.persistence=INFO
ai.agent.logging.category.security=WARN
ai.agent.logging.category.agents=INFO

# Logging Retention
ai.agent.logging.retention.days=30
ai.agent.logging.rotation.enabled=true
ai.agent.logging.rotation.max.size=100MB
ai.agent.logging.rotation.max.files=10

# =============================================================================
# Performance Configuration
# =============================================================================

# Memory Management
ai.agent.performance.max.memory.usage=1GB
ai.agent.performance.gc.optimization=true
ai.agent.performance.thread.pool.size=20

# Caching
ai.agent.performance.cache.enabled=true
ai.agent.performance.cache.size=1000
ai.agent.performance.cache.ttl=3600s

# Monitoring
ai.agent.performance.metrics.enabled=true
ai.agent.performance.metrics.collection.interval=60s
ai.agent.performance.health.checks.enabled=true

# =============================================================================
# Recovery Configuration
# =============================================================================

# Recovery Enablement
ai.agent.recovery.enabled=true
ai.agent.recovery.auto.restart=true
ai.agent.recovery.state.persistence=true

# Recovery Settings
ai.agent.recovery.max.attempts=3
ai.agent.recovery.backoff.delay=5s
ai.agent.recovery.timeout=60s
ai.agent.recovery.cleanup.enabled=true

# =============================================================================
# Development and Debugging
# =============================================================================

# Debug Mode
ai.agent.debug.enabled=false
ai.agent.debug.log.task.executions=true
ai.agent.debug.log.skill.calls=true
ai.agent.debug.log.persistence.operations=true

# Development Features
ai.agent.dev.enable.hot.reload=false
ai.agent.dev.enable.skill.discovery=true
ai.agent.dev.enable.configuration.reload=true
ai.agent.dev.enable.metrics.dashboard=true 