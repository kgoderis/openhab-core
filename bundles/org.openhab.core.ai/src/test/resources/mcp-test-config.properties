# MCP Integration Test Configuration

# MCP Server Configuration
mcp.server.host=localhost
mcp.server.port=8080
mcp.server.transport.type=STDIO

# Client Configuration
mcp.client.type=test
mcp.client.command=test-client
mcp.client.args=--test-mode

# Test Configuration
mcp.test.timeout=30000
mcp.test.retry.count=3
mcp.test.concurrent.requests=5

# Authentication (if required)
mcp.client.api.key=${MCP_TEST_API_KEY}
mcp.client.api.base.url=http://localhost:8080

# Transport Configuration
mcp.transport.stdio.enabled=true
mcp.transport.http.enabled=true
mcp.transport.websocket.enabled=true

# Tool Configuration
mcp.tools.items.enabled=true
mcp.tools.persistence.enabled=true
mcp.tools.things.enabled=true
mcp.tools.discovery.enabled=true
mcp.tools.config.enabled=true

# Performance Configuration
mcp.performance.max.concurrent.requests=10
mcp.performance.request.timeout=30000
mcp.performance.connection.timeout=10000

# Logging Configuration
mcp.logging.level=INFO
mcp.logging.enable.debug=false
mcp.logging.enable.trace=false 