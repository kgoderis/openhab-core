# A2A Integration Test Configuration

# A2A Server Configuration
a2a.server.host=localhost
a2a.server.port=8080
a2a.server.protocol.type=HTTP

# Client Configuration
a2a.client.type=test
a2a.client.command=test-client
a2a.client.args=--test-mode

# Test Configuration
a2a.test.timeout=30000
a2a.test.retry.count=3
a2a.test.concurrent.requests=5

# Authentication (if required)
a2a.client.api.key=${A2A_TEST_API_KEY}
a2a.client.api.base.url=http://localhost:8080/a2a

# Protocol Configuration
a2a.protocol.http.enabled=true
a2a.protocol.websocket.enabled=true
a2a.protocol.rest.enabled=true

# Skill Configuration
a2a.skills.items.enabled=true
a2a.skills.persistence.enabled=true
a2a.skills.things.enabled=true
a2a.skills.discovery.enabled=true
a2a.skills.config.enabled=true

# Performance Configuration
a2a.performance.max.concurrent.requests=10
a2a.performance.request.timeout=30000
a2a.performance.streaming.timeout=60000

# Security Configuration
a2a.security.enabled=true
a2a.security.auth.required=false
a2a.security.cors.enabled=true

# Logging Configuration
a2a.logging.level=INFO
a2a.logging.enable.request.logging=true
a2a.logging.enable.response.logging=true

# Test Data Configuration
a2a.test.data.items.count=100
a2a.test.data.things.count=50
a2a.test.data.persistence.services=3

# Mock Configuration
a2a.mock.enabled=true
a2a.mock.response.delay=100
a2a.mock.error.rate=0.1 